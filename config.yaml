# Home-Assistant-Add-on: OV-Budget
# Kopiere dieses Verzeichnis nach /addons/ov-budget und lade den Add-on-Store neu.
name: OV-Budget
slug: ov_budget
version: "1.0.0"
description: >-
  Pseudo-Budgetverwaltung, Wunschliste ("Wünsch dir was") und Aufgaben
  für einen THW-Ortsverband. Mit Divera-24/7-Anbindung.
url: https://github.com/Lexorius/ov-voldemort
arch:
  - aarch64
  - amd64
  - armv7

# Das Basisimage bringt kein s6-overlay mit – der Container startet /run.sh selbst.
init: false

boot: auto
startup: services

# Ingress: erscheint in der Seitenleiste, ohne Port nach außen zu öffnen
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: OV-Budget
panel_admin: false

# Optionaler direkter Zugriff, z.B. für das Handy im Heimnetz.
# Standard ist "deaktiviert" – Port bei Bedarf in der Add-on-Konfiguration setzen.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direkter Zugriff ohne Ingress (optional)

watchdog: "tcp://[HOST]:[PORT:8099]"

# Zugriff auf die Supervisor-API, um die Zugangsdaten des MariaDB-Add-ons zu holen
hassio_api: true
services:
  - mysql:want

options:
  db_name: ovbudget
  admin_username: admin
  admin_password: ""
  ov_name: THW Ortsverband
  db_host: ""
  db_port: 3306
  db_user: ""
  db_password: ""
  debug: false

schema:
  db_name: str
  admin_username: str
  admin_password: password?
  ov_name: str?
  db_host: str?
  db_port: port?
  db_user: str?
  db_password: password?
  debug: bool?
