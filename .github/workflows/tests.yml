name: Prüfungen

on:
  push:
    branches: [main]
    paths: ['ov-budget/**', 'connector/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['ov-budget/**', 'connector/**', '.github/workflows/tests.yml']

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, zip, gd, pdo, json
          coverage: none
      - name: Syntax aller PHP-Dateien
        run: |
          find ov-budget/src ov-budget/views ov-budget/public connector/src connector/public -name '*.php' -print0             | xargs -0 -n1 php -l > /dev/null
      - name: Prüfungen
        run: php ov-budget/tests/alle.php
