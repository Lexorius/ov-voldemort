# Betrieb als normaler Docker-Container (ohne Home Assistant).
# Der Container bringt seine eigene MariaDB mit – ein zweiter Dienst ist nicht
# nötig. Alle Daten liegen im Volume "data" unter /data.
services:
  app:
    build:
      context: ./ov-budget
      args:
        BUILD_FROM: php:8.3-fpm-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      OVB_DB_NAME: ovbudget
      OVB_ADMIN_USER: ${ADMIN_USER:-admin}
      # Leer lassen: dann erzeugt der erste Start ein Passwort und
      # schreibt es in das Containerprotokoll (docker compose logs app)
      OVB_ADMIN_PASS: ${ADMIN_PASSWORD:-}
      OVB_OV_NAME: ${OV_NAME:-THW Ortsverband}
      # Eine bereits vorhandene Datenbank nutzen? Dann diese drei setzen:
      # OVB_DB_HOST: mariadb.example
      # OVB_DB_USER: ovbudget
      # OVB_DB_PASS: geheim
    volumes:
      - data:/data
    ports:
      - "${HTTP_PORT:-8099}:8099"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8099/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  data:
