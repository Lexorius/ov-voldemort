# Betrieb als normaler Docker-Container (ohne Home Assistant).
# Auf einem Home Assistant OS / Supervised nimmst du stattdessen das Add-on –
# siehe README, Abschnitt "Home-Assistant-Add-on".
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ovbudget
      MARIADB_USER: ovbudget
      MARIADB_PASSWORD: ${DB_PASSWORD:-bitte-aendern}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-bitte-auch-aendern}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        BUILD_FROM: php:8.3-fpm-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      OVB_DB_HOST: db
      OVB_DB_PORT: "3306"
      OVB_DB_NAME: ovbudget
      OVB_DB_USER: ovbudget
      OVB_DB_PASS: ${DB_PASSWORD:-bitte-aendern}
      OVB_ADMIN_USER: ${ADMIN_USER:-admin}
      # Leer lassen: dann erzeugt der erste Start ein Passwort und
      # schreibt es in das Containerprotokoll (docker compose logs app)
      OVB_ADMIN_PASS: ${ADMIN_PASSWORD:-}
      OVB_OV_NAME: ${OV_NAME:-THW Ortsverband}
    volumes:
      - data:/data
    ports:
      - "${HTTP_PORT:-8099}:8099"

volumes:
  db:
  data:
