; Einstellungen für OV-Budget im Container
expose_php = Off
memory_limit = 256M
max_execution_time = 120

; Reserve über der Upload-Grenze der Anwendung (Standard dort: 10 MB)
upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 20

; Sitzungen liegen unter /data und überleben damit einen Neustart
session.save_path = /data/sessions
session.gc_maxlifetime = 86400
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

log_errors = On
error_log = /dev/stderr
