; Wird beim Bauen nach /etc/php<version>/php-fpm.d/ kopiert.
; Der Name beginnt mit zz, damit er nach der mitgelieferten www.conf
; eingelesen wird und deren Werte überschreibt.
[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Auf Alpine gibt es kein www-data – nginx bringt den Benutzer nginx mit
user = nginx
group = nginx
listen = 127.0.0.1:9000

; Umgebungsvariablen an PHP durchreichen (docker compose, OVB_*)
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
