; Wird beim Bauen nach /etc/php<version>/conf.d/ kopiert.
expose_php = Off
max_execution_time = 120

; --- PHP2Shell (CVE-2026-109618, CVE-2026-109619), Advisory vom 21.10.2026 ---
; Vollständig schützt nur ein gepatchtes PHP (8.5.12 / 8.4.27 / 8.3.36 / 8.2.35);
; bis Alpine es liefert, greifen die vom PHP-Projekt empfohlenen Maßnahmen:
; kein Sitzungs-Upload-Fortschritt (die Anwendung braucht ihn nicht), keine
; Backtraces bei fatalen Fehlern (PHP 8.5), keine PHP-eigene Speichergrenze
; (sonst lässt sich der verwundbare Out-of-Memory-Pfad gezielt auslösen –
; die Grenze setzt der Container), kleine Anfragen (Uploads kommen in Stücken).
session.upload_progress.enabled = Off
fatal_error_backtraces = Off
memory_limit = -1

; Obergrenze je Anfrage bewusst klein (siehe oben): große Dateien schneidet der
; Browser in Stücke von 8 MB, die Anwendung setzt sie zusammen (STAN) – so
; gehen Pakete von Gigabyte-Größe, ohne dass eine einzelne Anfrage groß wird.
upload_max_filesize = 40M
post_max_size = 48M
max_file_uploads = 100
; so lange darf das Einlesen eines großen Uploads dauern
max_input_time = 900

; Sitzungen liegen unter /data und überleben damit einen Neustart
session.save_path = /data/sessions
session.gc_maxlifetime = 86400
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

log_errors = On
error_log = /proc/self/fd/2
