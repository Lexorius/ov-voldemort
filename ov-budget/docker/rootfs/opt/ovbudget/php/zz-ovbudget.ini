; Wird beim Bauen nach /etc/php<version>/conf.d/ kopiert.
expose_php = Off
memory_limit = 256M
max_execution_time = 120

; Obergrenze für Uploads – die Anwendung begrenzt je Modul selbst (Einstellungen:
; Upload-Grenze für Anlagen, eigene Grenze für STAN-Pakete). STAN-Pakete sind
; gern mehrere hundert MB, darum hier großzügig; die Ablage liegt unter /data.
upload_max_filesize = 2048M
post_max_size = 2100M
max_file_uploads = 100
; so lange darf das Einlesen eines großen Uploads dauern
max_input_time = 900

; Sitzungen liegen unter /data und überleben damit einen Neustart
session.save_path = /data/sessions
session.gc_maxlifetime = 86400
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0

log_errors = On
error_log = /proc/self/fd/2
