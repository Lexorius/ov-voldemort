user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Muss mindestens so groß sein wie die Upload-Grenze in der Anwendung
    client_max_body_size 64m;

    server {
        listen      8099 default_server;
        listen      [::]:8099 default_server;
        server_name _;

        root  /app/public;
        index index.php;

        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # Für den Healthcheck des Containers
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # X-Forwarded-Proto und X-Ingress-Path reicht nginx automatisch
            # als HTTP_*-Parameter weiter – die Anwendung wertet sie selbst aus.
            fastcgi_read_timeout 120s;
        }

        location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # Punktdateien nicht ausliefern
        location ~ /\. {
            deny all;
        }
    }
}
