# Home-Assistant-Add-on: OV-Multitool
# Installation: die Repository-URL im Add-on Store hinzufuegen.
#
# Das Add-on ist eigenständig: Datenbank, Webserver und Anwendung stecken im
# Container, es sind keine weiteren Add-ons nötig.
name: OV-Multitool
# Der Slug bleibt: Home Assistant kennt das Add-on daran, mit ihm bleiben die Daten.
slug: ov_budget
version: "2.0.11.0"
description: >-
  Das Werkzeug für den THW-Ortsverband: Wünsche und Budget, Aufgaben, Kontakte,
  Besprechungen, Veranstaltungen, Fahrzeugakten, Funkgeräte, SIM-Karten und
  Verbrauch – mit Stein.APP-, Divera-24/7- und Home-Assistant-Anbindung.
  Eigene Datenbank inklusive. Früher OV-Budget.
url: https://github.com/Lexorius/ov-voldemort
arch:
  - aarch64
  - amd64
  - armv7

# Das Basisimage bringt kein s6-overlay mit – der Container startet /run.sh selbst.
init: false

# Zugangsdaten des Mosquitto-Add-ons, falls vorhanden (für den MQTT-Export)
services:
  - mqtt:want

# Für Benachrichtigungen: Aufruf von notify.<Ziel> in Home Assistant
homeassistant_api: true

boot: auto
startup: services

# Vor dem Backup anhalten, damit die Datenbankdateien in sich stimmig sind
backup: cold

# Ingress: erscheint in der Seitenleiste, ohne Port nach außen zu öffnen
ingress: true
ingress_port: 8099
panel_icon: mdi:toolbox-outline
panel_title: OV-Multitool
panel_admin: false

# Optionaler direkter Zugriff, z.B. für das Handy im Heimnetz.
# Standard ist "deaktiviert" – Port bei Bedarf in der Add-on-Konfiguration setzen.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direkter Zugriff ohne Ingress (optional)

watchdog: "tcp://[HOST]:[PORT:8099]"

options:
  ov_name: THW Ortsverband
  zeitzone: Europe/Berlin
  admin_username: admin
  admin_password: ""
  db_name: ovbudget
  db_host: ""
  db_port: 3306
  db_user: ""
  db_password: ""
  debug: false

schema:
  ov_name: str?
  zeitzone: str?
  admin_username: str
  admin_password: password?
  db_name: str
  db_host: str?
  db_port: port?
  db_user: str?
  db_password: password?
  debug: bool?
