configuration:
  ov_name:
    name: Name of the local unit
    description: Used as the heading on first start; can be changed inside the application later.
  admin_username:
    name: Administrator
    description: Username of the first account. Only created on the very first start.
  admin_password:
    name: Administrator password
    description: At least 10 characters. If left empty, a random password is generated and written to the log.
  db_name:
    name: Database name
    description: Created automatically inside the bundled database.
  db_host:
    name: External database host
    description: >-
      Leave empty to use the bundled MariaDB. Only fill in to use an existing
      database (e.g. core-mariadb); user and password are then required as well.
  db_port:
    name: External database port
    description: Defaults to 3306. Only used together with a host.
  db_user:
    name: External database user
    description: Only used together with a host.
  db_password:
    name: External database password
    description: Only used together with a host.
  debug:
    name: Show PHP errors
    description: For troubleshooting only.
network:
  8099/tcp: Direct access without ingress (optional)
