# Basisimages je Architektur.
# Bewusst die Home-Assistant-Basisimages: der Supervisor setzt sie ohnehin
# ein, und PHP kommt bei uns aus den Alpine-Paketen.
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:latest"
  amd64: "ghcr.io/home-assistant/amd64-base:latest"
  armv7: "ghcr.io/home-assistant/armv7-base:latest"
